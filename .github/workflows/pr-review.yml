# Pull request validation for the proposed integration.
#
# Security notes:
# - Uses pull_request (not pull_request_target) so untrusted PR code never
#   runs with secrets from the base repository.
# - Tests run against the PR merge commit without credentials.
# - GitHub API review execution is intentionally not part of pre-merge CI.
# - Checkout does not persist credentials.

name: ReflexiCode-Guard PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: reflexicode-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Automated tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the merge commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run the test suite
        run: python -m pytest -q
